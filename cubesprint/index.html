<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>魔方衝刺營 CubeSprint</title>
<style>
:root{
  --bg:#f3f5fa;--card:#ffffff;--ink:#1b2333;--muted:#5a6477;--line:#dde3ee;
  --accent:#2f6fed;--accent-ink:#ffffff;--accent-soft:#e7eeff;
  --good:#16884f;--good-soft:#e2f5ea;--warn:#b85f00;--warn-soft:#fff1de;--bad:#c23434;--bad-soft:#fde7e7;
  --gold:#b88a00;--silver:#6f7b8e;--bronze:#a35d22;
  --shadow:0 2px 10px rgba(20,30,60,.07);--radius:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141c;--card:#1a202d;--ink:#eef2fa;--muted:#a4aec2;--line:#2c3446;
    --accent:#6d9dff;--accent-ink:#0b1020;--accent-soft:#22304f;
    --good:#45c983;--good-soft:#16332a;--warn:#ffb24d;--warn-soft:#3a2a12;--bad:#ff7d7d;--bad-soft:#3b1e1e;
    --gold:#f0c641;--silver:#b9c3d4;--bronze:#e0a066;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141c;--card:#1a202d;--ink:#eef2fa;--muted:#a4aec2;--line:#2c3446;
  --accent:#6d9dff;--accent-ink:#0b1020;--accent-soft:#22304f;
  --good:#45c983;--good-soft:#16332a;--warn:#ffb24d;--warn-soft:#3a2a12;--bad:#ff7d7d;--bad-soft:#3b1e1e;
  --gold:#f0c641;--silver:#b9c3d4;--bronze:#e0a066;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
header.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:820px;margin:0 auto}
header.top .logo{width:34px;height:34px;flex:none}
header.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.5px}
header.top .sub{font-size:13px;color:var(--muted)}
main{max-width:820px;margin:0 auto;padding:0 16px}
.page{display:none}
.page.on{display:block}
h2{font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:17px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;min-height:48px;padding:8px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.chk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{min-height:64px;font-size:20px;padding:10px 24px;width:100%}
.btn.sm{min-height:48px;padding:4px 12px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1}
.stack > * + *{margin-top:10px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 0}
.tab .ic{font-size:22px;line-height:1}
.tab.on{color:var(--accent)}
.tab.on .ic{transform:scale(1.12)}
/* banner */
#banner{max-width:820px;margin:0 auto 10px;padding:0 16px}
#banner .inner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
/* home */
.hero{background:linear-gradient(135deg,var(--accent),#7b5cff);color:#fff;border:0}
.hero .days{font-size:clamp(46px,14vw,84px);font-weight:900;line-height:1;margin:6px 0}
.hero .days small{font-size:22px;font-weight:800;margin-left:6px}
.hero .meta{font-size:14.5px;opacity:.92}
.check-list{list-style:none;margin:0;padding:0}
.check-list li + li{margin-top:8px}
.chk{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:14px;min-height:56px;padding:8px 12px;cursor:pointer}
.chk .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
.chk.done{border-color:var(--good);background:var(--good-soft)}
.chk.done .box{background:var(--good);border-color:var(--good);color:#fff}
.chk .txt{flex:1}
.chk .stk{font-size:26px;animation:pop .45s ease-out}
.chk .prog{font-size:13px;color:var(--muted);display:block}
.go{font-size:14px;font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer;min-height:48px;padding:0 4px;white-space:nowrap;flex:none}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.bigsticker{font-size:56px;text-align:center;animation:pop .6s ease-out}
.gap-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.gap-row:first-of-type{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.c-gold{background:var(--gold)}.c-silver{background:var(--silver)}.c-bronze{background:var(--bronze)}
.stat-big{font-size:34px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px;font-size:28px}
/* timer page */
.scramble{font-size:clamp(19px,4.6vw,26px);font-weight:700;word-spacing:4px;letter-spacing:.5px;line-height:1.5}
.pad{user-select:none;-webkit-user-select:none;touch-action:none;border:2px dashed var(--line);border-radius:20px;min-height:min(40vh,320px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;cursor:pointer;background:var(--card)}
.pad .t{font-size:clamp(56px,17vw,120px);font-weight:900;line-height:1.05}
.pad .h{color:var(--muted);font-size:15px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-size:13px;color:var(--muted);font-weight:700}
.stat .v{font-size:22px;font-weight:900}
.solves{list-style:none;margin:0;padding:0}
.solves li{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.solves li:first-child{border-top:0}
.solves .n{width:34px;color:var(--muted);font-size:14px}
.solves .tm{flex:1;font-size:20px;font-weight:800;min-width:90px}
.solves .btn.sm{min-width:52px}
/* overlay */
#ov{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;padding:16px}
#ov.show{display:flex}
#ov .lab{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:120px;font-weight:800;color:var(--muted)}
#ov .x{position:absolute;top:calc(8px + env(safe-area-inset-top));right:12px}
#ov .time{font-size:clamp(84px,26vw,240px);font-weight:900;line-height:1}
#ov .hint{margin-top:14px;color:var(--muted);font-size:18px;font-weight:700;text-align:center}
#ov.hold .time{color:var(--bad)}
#ov.ready .time{color:var(--good)}
#ov.insp .time{color:var(--warn)}
#ov.res .time{color:var(--accent)}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:200;background:rgba(10,14,24,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.modal-card{background:var(--card);color:var(--ink);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:300;max-width:min(92vw,520px);pointer-events:none}
#toast .t{background:var(--ink);color:var(--bg);font-weight:800;padding:12px 18px;border-radius:14px;margin-bottom:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .35s ease-out;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#confetti{display:none}.chk .stk,.bigsticker,#toast .t{animation:none}}
/* drills */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:0}
.alg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.alg-card{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.alg-card.know{border-color:var(--good)}
.alg-card.shaky{border-color:var(--warn)}
.alg-card .nm{font-weight:900;font-size:18px}
.alg-card .al{font-size:13px;word-break:break-word}
.alg-card .st{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.alg-card .st button{min-height:44px;font-size:13px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.alg-card .st button.on.k{background:var(--good);color:#fff;border-color:var(--good)}
.alg-card .st button.on.s{background:var(--warn);color:#fff;border-color:var(--warn)}
.alg-card .st button.on.u{background:var(--muted);color:var(--card);border-color:var(--muted)}
.diagram{width:100%;max-width:150px;margin:0 auto;display:block}
.beat{width:46px;height:46px;border-radius:50%;background:var(--line);transition:background .05s}
.beat.on{background:var(--accent)}
input[type=range]{width:100%;min-height:40px}
input[type=number],input[type=text],select{font:inherit;min-height:48px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.switch:first-child{border-top:0}
.switch input{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.test{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px}
.test .r{font-weight:900;flex:none;width:64px}
.test .r.p{color:var(--good)}.test .r.f{color:var(--bad)}.test .r.s{color:var(--warn)}
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px}
.prob{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prob .p{background:var(--bg);border-radius:14px;padding:12px;text-align:center}
.prob .p b{display:block;font-size:34px;font-weight:900}
.mock-res{font-size:clamp(44px,13vw,72px);font-weight:900;line-height:1.1;text-align:center}
table.tb{width:100%;border-collapse:collapse;font-size:15px}
table.tb th,table.tb td{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.tb th{color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="#1b2333"/><g><rect x="4" y="4" width="8" height="8" rx="2" fill="#ffd500"/><rect x="13" y="4" width="8" height="8" rx="2" fill="#009b48"/><rect x="22" y="4" width="8" height="8" rx="2" fill="#b71234"/><rect x="4" y="13" width="8" height="8" rx="2" fill="#ff5800"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#ffffff"/><rect x="22" y="13" width="8" height="8" rx="2" fill="#0046ad"/><rect x="4" y="22" width="8" height="8" rx="2" fill="#009b48"/><rect x="13" y="22" width="8" height="8" rx="2" fill="#ffd500"/><rect x="22" y="22" width="8" height="8" rx="2" fill="#ff5800"/></g></svg>
  <div><h1>魔方衝刺營 CubeSprint</h1><div class="sub">115 學年度臺北市國小一般競速組 3x3x3</div></div>
</header>
<div id="banner" hidden><div class="inner" id="bannerText"></div></div>
<main>
  <section class="page" id="page-home" aria-label="今日任務"></section>
  <section class="page" id="page-timer" aria-label="計時器"></section>
  <section class="page" id="page-mock" aria-label="模擬比賽"></section>
  <section class="page" id="page-drills" aria-label="專項練習"></section>
  <section class="page" id="page-progress" aria-label="進度"></section>
  <section class="page" id="page-settings" aria-label="設定與資料"></section>
</main>
<nav class="tabs" aria-label="主選單">
  <button class="tab" data-page="home"><span class="ic">🏠</span>今日任務</button>
  <button class="tab" data-page="timer"><span class="ic">⏱️</span>計時器</button>
  <button class="tab" data-page="mock"><span class="ic">🏆</span>模擬比賽</button>
  <button class="tab" data-page="drills"><span class="ic">🎯</span>專項練習</button>
  <button class="tab" data-page="progress"><span class="ic">📈</span>進度</button>
  <button class="tab" data-page="settings"><span class="ic">⚙️</span>設定</button>
</nav>
<div id="ov" role="dialog" aria-live="polite">
  <div class="lab" id="ovLab"></div>
  <button class="btn sm x" id="ovX" type="button">✕ 取消</button>
  <div class="time num" id="ovTime">0.00</div>
  <div class="hint" id="ovHint"></div>
</div>
<div id="modal" hidden></div>
<div id="toast" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>

<script>
/*CORE-START*/
const CS = (function () {
  'use strict';
  const COMP_DATE = '2026-12-13';
  const INSPECTION_MS = 15000, PLUS2_MS = 17000, LIMIT_MS = 120000;
  const TARGETS = [
    { id: 'top6', label: '前六名（優勝）', short: '前六名線', seconds: 11.62, color: 'gold' },
    { id: 'merit', label: '前三十（優等）', short: '優等線', seconds: 16.48, color: 'silver' },
    { id: 'final', label: '進決賽參考', short: '進決賽參考線', seconds: 22.43, color: 'bronze' }
  ];
  const REF_POINTS = [[9.08, 1], [11.62, 6], [16.48, 30], [22.43, 48]];
  const DEFAULT_SETTINGS = { inspection_enforced: true, voice: true, hide_timer: false, nerve_factor: 1.05, inspection_practice: true, theme: 'auto', bpm: 60 };

  /* ---------- 打亂 ---------- */
  const FACES = ['R', 'L', 'U', 'D', 'F', 'B'];
  const AXIS = { R: 0, L: 0, U: 1, D: 1, F: 2, B: 2 };
  const SUF = ['', "'", '2'];
  function genScramble(rng, len) {
    rng = rng || Math.random; len = len || 20;
    const out = [];
    while (out.length < len) {
      const f = FACES[Math.floor(rng() * 6)];
      const n = out.length;
      if (n >= 1 && out[n - 1][0] === f) continue;
      if (n >= 2 && AXIS[out[n - 1][0]] === AXIS[f] && AXIS[out[n - 2][0]] === AXIS[f]) continue;
      out.push(f + SUF[Math.floor(rng() * 3)]);
    }
    return out.join(' ');
  }
  function checkScramble(s) {
    const t = s.split(' ');
    if (t.length !== 20) return '步數不是 20';
    for (let i = 0; i < t.length; i++) {
      if (!/^[RLUDFB]('|2)?$/.test(t[i])) return '出現不合法的步驟 ' + t[i];
      if (i >= 1 && t[i][0] === t[i - 1][0]) return '相鄰同面：' + t[i - 1] + ' ' + t[i];
      if (i >= 2 && AXIS[t[i][0]] === AXIS[t[i - 1][0]] && AXIS[t[i][0]] === AXIS[t[i - 2][0]]) return '連續三步同軸：' + t.slice(i - 2, i + 1).join(' ');
    }
    return null;
  }

  /* ---------- 成績統計 ---------- */
  function eff(s) { if (!s) return null; if (s.penalty === 'DNF') return Infinity; return s.ms + (s.penalty === '+2' ? 2000 : 0); }
  // values: 已含罰秒的毫秒數，DNF = Infinity；去掉最快與最慢後平均；兩次以上 DNF 結果為 DNF
  function aoN(values, n) {
    if (values.length < n) return null;
    const w = values.slice(-n);
    if (w.filter(v => v === Infinity).length >= 2) return Infinity;
    const s = w.slice().sort((a, b) => a - b);
    const mid = s.slice(1, n - 1);
    return mid.reduce((a, b) => a + b, 0) / mid.length;
  }
  function bestAoN(values, n) {
    let best = null;
    for (let i = n; i <= values.length; i++) {
      const a = aoN(values.slice(i - n, i), n);
      if (a !== null && a !== Infinity && (best === null || a < best)) best = a;
    }
    return best;
  }
  function bestOf(values) { let b = null; for (const v of values) if (Number.isFinite(v) && (b === null || v < b)) b = v; return b; }
  function meanValid(values) { const v = values.filter(Number.isFinite); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
  function inspectionPenalty(elapsedMs) { if (elapsedMs <= INSPECTION_MS) return 'none'; if (elapsedMs <= PLUS2_MS) return '+2'; return 'DNF'; }
  function runLimit(elapsedMs) { return elapsedMs >= LIMIT_MS ? { ms: LIMIT_MS, penalty: 'DNF' } : null; }
  // 兩轉取最快；全部 DNF 回傳 null（＝DNF）
  function roundBest(effValues) { return bestOf(effValues); }
  function estimateRank(sec) {
    const P = REF_POINTS;
    if (sec === null || !Number.isFinite(sec)) return null;
    if (sec <= P[0][0]) return { rank: 1, faster: true };
    for (let i = 0; i < P.length - 1; i++) {
      const [x0, r0] = P[i], [x1, r1] = P[i + 1];
      if (sec <= x1) return { rank: Math.max(1, Math.round(r0 + (sec - x0) / (x1 - x0) * (r1 - r0))) };
    }
    return { rank: 48, beyond: true };
  }
  function bootstrap(msList, factor, iters, rng) {
    iters = iters || 10000; rng = rng || Math.random;
    const n = msList.length; if (!n) return null;
    let a = 0, b = 0;
    const t1 = TARGETS[0].seconds * 1000, t2 = TARGETS[1].seconds * 1000;
    for (let i = 0; i < iters; i++) {
      const x = msList[Math.floor(rng() * n)] * factor, y = msList[Math.floor(rng() * n)] * factor;
      const m = Math.min(x, y);
      if (m < t1) a++;
      if (m < t2) b++;
    }
    return { n, iters, pTop6: a / iters, pMerit: b / iters };
  }

  /* ================= 成績紀錄與個人紀錄 ================= */

    const before = effList(fullSolves());

    DB.solves.push(solve); save();
    const after = effList(fullSolves());
    const e = CS.eff(solve);
    const msgs = [];
    if (pbS !== null && Number.isFinite(e) && e < pbS) msgs.push('最佳單次 ' + fmt(e));
    const n5 = CS.bestAoN(after, 5), n12 = CS.bestAoN(after, 12);
    if (pb5 !== null && n5 !== null && n5 < pb5) msgs.push('最佳 ao5 ' + fmtAvg(n5));
    if (pb12 !== null && n12 !== null && n12 < pb12) msgs.push('最佳 ao12 ' + fmtAvg(n12));
    if (msgs.length) { confetti(); toast('🎉 破個人紀錄！' + msgs.join('、'), 4000); }
    else if (solve.penalty === 'DNF') toast('這次沒完成也沒關係，下一次會更好！');
  }

  function prevAttempts() {

  }
  ACT.mkStart = () => { MK = newMock(!!renderMock.judge); renderMock(); };
  ACT.mkJudgeStart = () => { if (MK && MK.step === 'attempt') { T.configure(ctxMock()); T.startInspection(); } };
  ACT.mkPen = el => { if (MK && MK.pending) { MK.pending.penalty = el.dataset.p; renderMock(); } };
  ACT.mkConfirm = () => {

  /* ================= 進度 ================= */
  function dailySeries() {
    const by = new Map();
    for (const s of fullSolves()) { const d = CS.localDate(s.timestamp); if (!by.has(d)) by.set(d, []); by.get(d).push(CS.eff(s)); }
    return Array.from(by.keys()).sort().map(d => { const v = by.get(d); const a = CS.aoN(v, 12); return { date: d, ao12: a === Infinity ? null : a, best: CS.bestOf(v), n: v.length }; });
  }
  function niceStep(range) { return range <= 8 ? 1 : range <= 20 ? 2 : range <= 50 ? 5 : 10; }
  function lineChart(days) {
    const vals = []; days.forEach(d => { if (d.ao12 != null) vals.push(d.ao12 / 1000); if (d.best != null) vals.push(d.best / 1000); });
    if (!vals.length) return '<p class="muted">還沒有成績。完成幾次計時後這裡就會出現折線圖。</p>';
    const W = 420, H = 250, L = 30, R = 46, Tp = 12, B = 28;
    let lo = Math.floor(Math.min.apply(null, vals.concat([CS.TARGETS[0].seconds])) - 1), hi = Math.ceil(Math.max.apply(null, vals.concat([CS.TARGETS[2].seconds])) + 1);
    lo = Math.max(0, lo);
    const x = i => days.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (days.length - 1);
    const y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);
    let g = '';
    const st = niceStep(hi - lo);
    for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="12" fill="var(--muted)">' + v + '</text>';
    CS.TARGETS.forEach(t => { g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t.seconds) + '" y2="' + y(t.seconds) + '" stroke="var(--' + t.color + ')" stroke-width="2" stroke-dasharray="6 5"/><text x="' + (W - R + 4) + '" y="' + (y(t.seconds) + 4) + '" font-size="12" font-weight="800" fill="var(--' + t.color + ')">' + t.seconds.toFixed(2) + '</text>'; });

  function histogram(vals) {
    const v = vals.filter(Number.isFinite).map(x => x / 1000);

    const lo = Math.floor(Math.min.apply(null, v)), hi = Math.floor(Math.max.apply(null, v));
    const bins = []; for (let b = lo; b <= hi; b++) bins.push({ b, n: 0 });
    v.forEach(x => bins[Math.floor(x) - lo].n++);
    const max = Math.max.apply(null, bins.map(b => b.n));
    const W = 420, H = 200, L = 6, R = 6, Tp = 16, B = 24; const bw = (W - L - R) / bins.length;
    let g = '';
    bins.forEach((b, i) => {
      const h = b.n / max * (H - Tp - B); const X = L + i * bw, Y = H - B - h;
      g += '<rect x="' + (X + 1).toFixed(1) + '" y="' + Y.toFixed(1) + '" width="' + Math.max(1, bw - 2).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="var(--accent)"><title>' + b.b + '–' + (b.b + 1) + ' 秒：' + b.n + ' 次</title></rect>';
      if (b.n && bw > 16) g += '<text x="' + (X + bw / 2).toFixed(1) + '" y="' + (Y - 4).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">' + b.n + '</text>';
      const step = Math.ceil(bins.length / 12);
